  <!-- APPLICATION LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA_A-v2kRDBiry1iv1zC-Up3eMAvI1-NUs",
      authDomain: "realmoderzs.firebaseapp.com",
      databaseURL: "https://realmoderzs-default-rtdb.firebaseio.com",
      projectId: "realmoderzs",
      storageBucket: "realmoderzs.firebasestorage.app",
      messagingSenderId: "879115715712",
      appId: "1:879115715712:web:93b9584c6ecc7bbf951265"
    };

    const urlParams = new URLSearchParams(window.location.search);
    const linkId = (urlParams.get("id") || urlParams.get("linkId") || "").trim();
    const keyId = (urlParams.get("keyId") || "").trim();

    // AUTO-FORWARD IF USER ACCIDENTALLY OPENED KEY LINK HERE
    if (!linkId && keyId) {
      window.location.replace(`key-unlock.html?keyId=${keyId}${urlParams.get("verified") ? '&verified=true' : ''}`);
    }

    async function init() {
      if (!linkId) {
        showError("Invalid or missing Link ID parameter in URL.");
        return;
      }

      try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        // Auto Anonymous Auth so Firebase never throws Access Denied
        try { await signInAnonymously(auth); } catch (e) {}

        const db = getDatabase(app);
        const linkRef = ref(db, `links/${linkId}`);

        onValue(linkRef, (snapshot) => {
          if (snapshot.exists()) {
            renderUnlocker(snapshot.val());
          } else {
            // Also check if this ID belongs to a Key
            const keyCheckRef = ref(db, `keys/${linkId}`);
            onValue(keyCheckRef, (keySnap) => {
              if (keySnap.exists()) {
                window.location.replace(`key-unlock.html?keyId=${linkId}`);
              } else {
                showError("Link not found or it was removed by Admin.");
              }
            });
          }
        }, (err) => {
          showError("Access Error: " + err.message);
        });
      } catch (e) {
        showError(e.message);
      }
    }

    function showError(msg) {
      document.getElementById("loading-state").classList.add("hidden");
      document.getElementById("content-state").classList.add("hidden");
      document.getElementById("error-state").classList.remove("hidden");
      document.getElementById("error-message").textContent = msg;
    }

    let completedTasks = new Set();
    let totalTasksCount = 0;
    let targetDestination = "";

    function renderUnlocker(data) {
      targetDestination = data.destinationLink;
      document.getElementById("loading-state").classList.add("hidden");
      document.getElementById("error-state").classList.add("hidden");
      document.getElementById("content-state").classList.remove("hidden");

      document.getElementById("node-brand-title").textContent = data.brandName || "Download Link";

      const tasksContainer = document.getElementById("tasks-container");
      tasksContainer.innerHTML = "";
      const tasks = data.tasks || [];
      totalTasksCount = tasks.length;

      if (totalTasksCount === 0) {
        enableUnlockButton();
        return;
      }

      tasks.forEach((t, idx) => {
        let icon = "fa-brands fa-youtube text-red-500";
        if (t.platform === "telegram") icon = "fa-brands fa-telegram text-cyan-400";
        if (t.platform === "instagram") icon = "fa-brands fa-instagram text-pink-500";

        const btn = document.createElement("button");
        btn.id = `task-btn-${idx}`;
        btn.className = "w-full p-3 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-between text-xs font-bold text-white transition-all cursor-pointer";
        btn.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-xl bg-white/5 flex items-center justify-center text-sm">
              <i class="${icon}"></i>
            </div>
            <span>${t.title || 'Complete Task'}</span>
          </div>
          <div id="task-status-${idx}" class="text-[10px] text-slate-400 px-2 py-1 rounded-lg bg-black/40">
            START
          </div>
        `;

        btn.onclick = () => {
          window.open(t.url, "_blank");
          const statusBox = document.getElementById(`task-status-${idx}`);
          statusBox.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-amber-400"></i>`;
          
          setTimeout(() => {
            statusBox.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> DONE`;
            btn.classList.add("border-emerald-500/40", "bg-emerald-500/10");
            completedTasks.add(idx);
            if (completedTasks.size >= totalTasksCount) {
              enableUnlockButton();
            }
          }, 3500);
        };

        tasksContainer.appendChild(btn);
      });
    }

    function enableUnlockButton() {
      const btn = document.getElementById("final-unlock-btn");
      btn.disabled = false;
      btn.className = "w-full py-3.5 px-4 rounded-2xl font-black text-xs uppercase tracking-wider text-slate-950 bg-gradient-to-r from-emerald-400 to-teal-300 hover:opacity-95 shadow-lg shadow-emerald-500/20 active:scale-[0.98] transition-all cursor-pointer flex items-center justify-center gap-2";
      document.getElementById("unlock-btn-icon").className = "fa-solid fa-unlock";
      document.getElementById("unlock-btn-text").textContent = "GET UNLOCKED LINK";

      btn.onclick = () => {
        window.location.href = targetDestination;
      };
    }

    init();
  </script>
