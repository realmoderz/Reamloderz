<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Complete Tasks To Unlock Link</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { yt: '#FF0000', tg: '#229ED9', ig: '#E1306C' }
          }
        }
      }
    };
  </script>

  <!-- FontAwesome 6 Icons & Google Font -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .glass-card {
      background: #0f172aee;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7);
      transform: translateZ(0);
    }

    .task-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .task-card-completed {
      background: rgba(16, 185, 129, 0.08) !important;
      border-color: rgba(52, 211, 153, 0.35) !important;
    }

    .ad-slot-box {
      width: 320px;
      height: 50px;
      max-width: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
    }
  </style>
</head>

<body class="bg-[#07090e] text-slate-100 min-h-screen flex flex-col justify-between items-center p-3 sm:p-4 selection:bg-cyan-500 selection:text-black">

  <!-- TOP AD BANNER -->
  <div class="w-full flex justify-center my-2">
    <div class="ad-slot-box">
      <script>
        atOptions = {
          'key' : '7ec14d4dbf15922518bb543fa461d221',
          'format' : 'iframe',
          'height' : 50,
          'width' : 320,
          'params' : {}
        };
      </script>
      <script src="https://bicea.org/22/7ec14d4dbf15922518bb543fa461d221"></script>
    </div>
  </div>

  <!-- MAIN CARD CONTAINER -->
  <main class="w-full max-w-md glass-card rounded-3xl p-5 sm:p-7 my-auto">
    
    <!-- 1. LOADING STATE -->
    <div id="loading-state" class="flex flex-col items-center justify-center py-10 space-y-3">
      <div class="w-9 h-9 rounded-full border-2 border-white/10 border-t-cyan-400 animate-spin"></div>
      <p class="text-xs font-semibold text-slate-400 tracking-wider uppercase">Loading Tasks...</p>
    </div>

    <!-- 2. ERROR STATE -->
    <div id="error-state" class="hidden flex flex-col items-center text-center py-6 space-y-3">
      <div class="w-12 h-12 rounded-2xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-xl">
        <i class="fa-solid fa-circle-exclamation"></i>
      </div>
      <h2 class="text-sm font-bold text-white">Notice</h2>
      <p id="error-message" class="text-xs text-slate-400 max-w-xs">Link ID invalid. Loading default mode...</p>
      <button onclick="window.location.reload()" class="mt-2 text-xs font-bold text-cyan-400 hover:underline">Try Again</button>
    </div>

    <!-- 3. MAIN UNLOCK CONTENT -->
    <div id="content-state" class="hidden space-y-4">
      
      <!-- Brand & Header -->
      <div class="text-center space-y-1">
        <div class="inline-flex mb-1">
          <div id="lock-badge" class="w-11 h-11 rounded-2xl bg-white/5 border border-white/10 text-cyan-400 flex items-center justify-center text-base transition-colors duration-300">
            <i id="lock-icon" class="fa-solid fa-lock"></i>
          </div>
        </div>
        <h1 id="brand-title" class="text-base sm:text-lg font-extrabold text-white tracking-tight">Realmoderz</h1>
        <p class="text-[11px] text-slate-400">Complete all required steps to unlock your link</p>
      </div>

      <!-- PROGRESS BAR & COUNTER -->
      <div class="bg-white/[0.03] border border-white/5 rounded-2xl p-3 space-y-2">
        <div class="flex items-center justify-between text-xs font-semibold">
          <span class="text-slate-400 flex items-center gap-1.5">
            <span id="pulse-dot" class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
            Tasks Progress
          </span>
          <span id="task-counter" class="font-mono text-cyan-400 font-bold">0 / 0</span>
        </div>
        <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
          <div id="progress-bar-fill" class="bg-cyan-400 h-full rounded-full transition-all duration-300 w-0"></div>
        </div>
      </div>

      <!-- TASKS CONTAINER -->
      <div id="tasks-container" class="space-y-2.5"></div>

      <!-- UNLOCK BUTTON -->
      <button
        id="unlock-btn"
        disabled
        class="w-full py-3.5 px-4 rounded-2xl font-bold text-xs uppercase tracking-wider transition-all duration-300 flex items-center justify-center gap-2 bg-white/5 text-slate-500 border border-white/5 cursor-not-allowed opacity-50 select-none"
      >
        <i id="unlock-btn-icon" class="fa-solid fa-lock text-xs"></i>
        <span id="unlock-btn-text">Complete Tasks First</span>
      </button>

    </div>
  </main>

  <!-- BOTTOM AD BANNER -->
  <div class="w-full flex justify-center my-2">
    <div class="ad-slot-box">
      <script>
        atOptions = {
          'key' : '7ec14d4dbf15922518bb543fa461d221',
          'format' : 'iframe',
          'height' : 50,
          'width' : 320,
          'params' : {}
        };
      </script>
      <script src="https://bicea.org/22/7ec14d4dbf15922518bb543fa461d221"></script>
    </div>
  </div>

  <!-- APPLICATION LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA_A-v2kRDBiry1iv1zC-Up3eMAvI1-NUs",
      authDomain: "realmoderzs.firebaseapp.com",
      databaseURL: "https://realmoderzs-default-rtdb.firebaseio.com",
      projectId: "realmoderzs",
      storageBucket: "realmoderzs.firebasestorage.app",
      messagingSenderId: "879115715712",
      appId: "1:879115715712:web:93b9584c6ecc7bbf951265"
    };

    const FALLBACK_DATA = {
      brandName: "Realmoderz Links",
      destinationLink: "https://google.com",
      tasks: [
        { platform: "youtube", title: "Subscribe to YouTube Channel", url: "https://youtube.com" },
        { platform: "telegram", title: "Join Telegram Channel", url: "https://t.me" },
        { platform: "instagram", title: "Follow us on Instagram", url: "https://instagram.com" }
      ]
    };

    const platformPresets = {
      youtube: { icon: "fa-brands fa-youtube", color: "text-red-500", bg: "bg-red-500/10", defaultTitle: "Subscribe on YouTube" },
      telegram: { icon: "fa-brands fa-telegram", color: "text-sky-400", bg: "bg-sky-400/10", defaultTitle: "Join Telegram Channel" },
      instagram: { icon: "fa-brands fa-instagram", color: "text-pink-500", bg: "bg-pink-500/10", defaultTitle: "Follow on Instagram" },
      default: { icon: "fa-solid fa-link", color: "text-cyan-400", bg: "bg-cyan-400/10", defaultTitle: "Complete Task" }
    };

    let destinationUrl = "";
    let tasksList = [];
    let linkId = "";
    let storageKey = "demo";
    let pendingTaskIndex = null;
    let pendingTime = 0;

    const completedTasks = new Set();
    const openedTasks = new Set();

    // STRICT EXPIRY TIMER: 10 Minutes (in milliseconds)
    const EXPIRY_TIME = 10 * 60 * 1000; 

    async function init() {
      const urlParams = new URLSearchParams(window.location.search);
      linkId = (urlParams.get("id") || "").trim();
      storageKey = linkId || "demo";

      if (!linkId) {
        loadData(FALLBACK_DATA);
        return;
      }

      try {
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const linkRef = ref(db, `links/${linkId}`);
        const snapshot = await get(linkRef);

        if (snapshot.exists()) {
          loadData(snapshot.val());
        } else {
          loadData(FALLBACK_DATA);
        }
      } catch (err) {
        loadData(FALLBACK_DATA);
      }
    }

    function loadData(data) {
      destinationUrl = data.destinationLink || "https://google.com";
      tasksList = Array.isArray(data.tasks) ? data.tasks : [];

      try {
        const savedTime = localStorage.getItem(`rm_time_${storageKey}`);
        const currentTime = Date.now();

        // 10 मिनट से ज़्यादा होने पर पूरा प्रोग्रेस रीसेट कर दें
        if (!savedTime || (currentTime - parseInt(savedTime, 10)) > EXPIRY_TIME) {
          localStorage.removeItem(`rm_completed_${storageKey}`);
          localStorage.removeItem(`rm_opened_${storageKey}`);
          localStorage.setItem(`rm_time_${storageKey}`, currentTime.toString());
        } else {
          // 10 मिनट के अंदर हैं, तो सेव किया हुआ स्टेट ही दिखाएं
          const savedCompleted = localStorage.getItem(`rm_completed_${storageKey}`);
          if (savedCompleted) {
            JSON.parse(savedCompleted).forEach(idx => completedTasks.add(idx));
          }

          const savedOpened = localStorage.getItem(`rm_opened_${storageKey}`);
          if (savedOpened) {
            JSON.parse(savedOpened).forEach(idx => openedTasks.add(idx));
          }
        }
      } catch (e) {
        console.warn("Storage check exception", e);
      }

      document.getElementById("brand-title").textContent = data.brandName || "Realmoderz";

      renderTasksContainer();
      updateProgressDisplay();
      evaluateUnlockStatus();

      document.getElementById("loading-state").classList.add("hidden");
      document.getElementById("error-state").classList.add("hidden");
      document.getElementById("content-state").classList.remove("hidden");
    }

    function saveState() {
      try {
        localStorage.setItem(`rm_completed_${storageKey}`, JSON.stringify(Array.from(completedTasks)));
        localStorage.setItem(`rm_opened_${storageKey}`, JSON.stringify(Array.from(openedTasks)));
        localStorage.setItem(`rm_time_${storageKey}`, Date.now().toString());
      } catch (e) {}
    }

    function renderTasksContainer() {
      const container = document.getElementById("tasks-container");
      container.innerHTML = "";

      tasksList.forEach((task, index) => {
        const platform = (task.platform || "").toLowerCase();
        const conf = platformPresets[platform] || platformPresets.default;
        const isCompleted = completedTasks.has(index);

        const card = document.createElement("div");
        card.id = `task-card-${index}`;
        card.className = `w-full p-3 rounded-2xl task-card flex items-center justify-between gap-3 ${
          isCompleted ? "task-card-completed" : ""
        }`;

        card.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden">
            <div class="w-9 h-9 shrink-0 rounded-xl flex items-center justify-center text-sm ${conf.bg} ${conf.color}">
              <i class="${conf.icon}"></i>
            </div>
            <div class="text-left truncate">
              <p id="task-title-${index}" class="text-xs font-bold truncate ${isCompleted ? 'text-emerald-300 line-through' : 'text-slate-100'}">
                ${task.title || conf.defaultTitle}
              </p>
              <span class="text-[9px] uppercase tracking-wider font-extrabold text-slate-400">Step ${index + 1}</span>
            </div>
          </div>
          <div id="task-action-${index}" class="shrink-0 flex items-center"></div>
        `;

        container.appendChild(card);
        updateTaskActionSlot(index);
      });
    }

    function updateTaskActionSlot(index) {
      const slot = document.getElementById(`task-action-${index}`);
      if (!slot) return;

      if (completedTasks.has(index)) {
        slot.innerHTML = `
          <div class="w-8 h-8 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-sm">
            <i class="fa-solid fa-circle-check"></i>
          </div>
        `;
        return;
      }

      if (openedTasks.has(index)) {
        slot.innerHTML = `
          <button id="btn-verify-${index}" class="px-3 py-1.5 rounded-xl text-xs font-extrabold bg-cyan-400 hover:bg-cyan-300 text-slate-950 flex items-center gap-1.5 transition-transform active:scale-95 shadow-sm cursor-pointer">
            <span>Verify</span>
            <i class="fa-solid fa-check text-[10px]"></i>
          </button>
        `;
        document.getElementById(`btn-verify-${index}`).onclick = () => handleVerifyClick(index);
      } else {
        slot.innerHTML = `
          <button id="btn-open-${index}" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-white/10 hover:bg-white/15 text-slate-200 flex items-center gap-1.5 transition-transform active:scale-95 cursor-pointer">
            <span>Go</span>
            <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-slate-400"></i>
          </button>
        `;
        document.getElementById(`btn-open-${index}`).onclick = () => handleOpenClick(index);
      }
    }

    function handleOpenClick(index) {
      const task = tasksList[index];
      openedTasks.add(index);
      pendingTaskIndex = index;
      pendingTime = Date.now();

      saveState();
      updateTaskActionSlot(index);

      if (task && task.url) {
        window.open(task.url, "_blank", "noopener,noreferrer");
      }
    }

    function handleVerifyClick(index) {
      const slot = document.getElementById(`task-action-${index}`);
      if (!slot) return;

      slot.innerHTML = `
        <div class="w-8 h-8 rounded-xl bg-cyan-400/10 text-cyan-400 flex items-center justify-center text-xs">
          <i class="fa-solid fa-spinner fa-spin"></i>
        </div>
      `;

      setTimeout(() => {
        markTaskComplete(index);
      }, 400);
    }

    function markTaskComplete(index) {
      completedTasks.add(index);
      saveState();

      const card = document.getElementById(`task-card-${index}`);
      if (card) card.classList.add("task-card-completed");

      const title = document.getElementById(`task-title-${index}`);
      if (title) {
        title.classList.add("text-emerald-300", "line-through");
        title.classList.remove("text-slate-100");
      }

      updateTaskActionSlot(index);
      updateProgressDisplay();
      evaluateUnlockStatus();
    }

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && pendingTaskIndex !== null) {
        const timeSpent = Date.now() - pendingTime;
        if (timeSpent >= 3000) {
          markTaskComplete(pendingTaskIndex);
          pendingTaskIndex = null;
        }
      }
    });

    function updateProgressDisplay() {
      const total = tasksList.length;
      const count = completedTasks.size;
      document.getElementById("task-counter").textContent = `${count} / ${total}`;

      const percentage = total > 0 ? (count / total) * 100 : 0;
      document.getElementById("progress-bar-fill").style.width = `${percentage}%`;
    }

    function evaluateUnlockStatus() {
      const isFinished = tasksList.length > 0 && completedTasks.size === tasksList.length;
      const unlockBtn = document.getElementById("unlock-btn");
      const lockBadge = document.getElementById("lock-badge");
      const lockIcon = document.getElementById("lock-icon");

      if (isFinished) {
        unlockBtn.disabled = false;
        unlockBtn.className = "w-full py-3.5 px-4 rounded-2xl font-black text-xs uppercase tracking-wider text-slate-950 bg-gradient-to-r from-emerald-400 to-cyan-400 hover:opacity-95 shadow-lg shadow-emerald-500/20 active:scale-[0.98] transition-all cursor-pointer flex items-center justify-center gap-2";
        unlockBtn.innerHTML = `<span>Get Target Link</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
        
        lockBadge.className = "w-11 h-11 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center justify-center text-base transition-colors duration-300";
        lockIcon.className = "fa-solid fa-lock-open";

        unlockBtn.onclick = () => {
          if (destinationUrl) {
            window.location.href = destinationUrl;
          }
        };
      }
    }

    init();
  </script>
</body>
</html>
